esson-operations-03.html","name":"Failure recovery and operational runbooks","description":"Rehearse a real worker failure and resume from an atomic complete-state checkpoint. Verify the next update and every later state against an uninterrupted reference."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-04.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-04.html","name":"Changes, rollback, and artifact provenance","description":"Activate and roll back identified local model bundles, verify consumer predictions and preserve the active model after a rejected selection."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-05.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-05.html","name":"Capacity, utilization, and operating cost","description":"Measure end-to-end local service time at more than one workload length. Compute offered load, worker reserve and illustrative cost with consistent units."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-06.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-06.html","name":"MLOps: data contracts, CI gates and monitoring","description":"Evaluate predictions from a reloaded local artifact and apply group-safe, count-weighted slice and release rules."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-07.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-07.html","name":"LLMOps: version prompts, evaluate behavior and trace requests","description":"Trace an executed local retrieval, prompt and answer workflow, pair responses by case ID and diagnose component failures before comparing candidates."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-08.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-operations-08.html","name":"ModelOps: own, approve, roll back and retire a model","description":"Bind approval to a model bundle, verify consumer activation/rollback, and enforce retired-target and fallback policies."}]}},{"@type":"ListItem","position":18,"item":{"@type":"Course","@id":"https://www.tahabouhsine.com/jaxpathways/phase-guides/pretraining.html#course","url":"https://www.tahabouhsine.com/jaxpathways/phase-guides/pretraining.html","name":"Self-supervised pretraining: masked and contrastive learning","description":"Train small masked-token, hidden-patch and paired-view models. Audit information leakage, reduction counts and pair identity before interpreting a falling objective.","inLanguage":"en","isAccessibleForFree":true,"author":{"@id":"https://www.tahabouhsine.com/jaxpathways/#author"},"provider":{"@id":"https://www.tahabouhsine.com/jaxpathways/#project"},"teaches":"Complete stages 1–3 of training-methods with independent loss references, real training curves, changed masks or pairs and explicit synthetic-data limits.","coursePrerequisites":["Transformers & language models"],"dateModified":"2026-10-27","syllabusSections":[{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-01.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-01.html","name":"Masked language modeling: predict hidden tokens","description":"Audit selected-token MLM loss and transfer a saved small encoder to held-out masks and a frozen representation probe."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-02.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-02.html","name":"Masked image modeling: reconstruct missing patches","description":"Audit visible-only masked reconstruction and compare a saved small encoder across changed masks and a frozen representation probe."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-03.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-pretraining-03.html","name":"Contrastive learning: views, positives and negatives","description":"Train a bounded contrastive objective and check held-out grouped retrieval with multiple positives and a saved encoder identity."}]}},{"@type":"ListItem","position":19,"item":{"@type":"Course","@id":"https://www.tahabouhsine.com/jaxpathways/phase-guides/posttraining.html#course","url":"https://www.tahabouhsine.com/jaxpathways/phase-guides/posttraining.html","name":"Post-training: SFT, LoRA, reward models and RLHF","description":"Connect supervised demonstrations, frozen-base LoRA, reward modeling, sampled PPO and direct preference optimization. Keep the reference, behavior policy, reward model and dataset identities separate.","inLanguage":"en","isAccessibleForFree":true,"author":{"@id":"https://www.tahabouhsine.com/jaxpathways/#author"},"provider":{"@id":"https://www.tahabouhsine.com/jaxpathways/#project"},"teaches":"Complete stages 4–8 of training-methods. Retain shifted token-mask checks, frozen-base/merge evidence, preference oracles, signed PPO clipping and fixed-reference DPO comparisons.","coursePrerequisites":["Self-supervised pretraining: masked and contrastive learning"],"dateModified":"2026-10-27","syllabusSections":[{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-01.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-01.html","name":"Supervised fine-tuning with response-only token loss","description":"Align response-only shifted targets, then apply a bounded saved-decoder SFT transfer with frozen baselines, tokenizer identity and held-out reporting."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-02.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-02.html","name":"LoRA: adapt, save and merge low-rank updates","description":"Separate frozen-base and low-rank updates, then save and reload a base-bound adapter with nonunit scaling and wrong-base rejection."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-03.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-03.html","name":"Learn a reward model from pairwise preferences","description":"Fit pairwise reward differences and evaluate unchanged held-out unanimous and disagreement cases against a pre-fit baseline."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-04.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-04.html","name":"RLHF mechanics: a frozen reward and PPO policy updates","description":"Keep three identities separate. Collect actions before optimizing them."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-05.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-posttraining-05.html","name":"Direct preference optimization and reference-corrected margins","description":"Compare reference-corrected preference margins, then score unequal-length saved-decoder responses with explicit masks and a bounded sequence update."}]}},{"@type":"ListItem","position":20,"item":{"@type":"Course","@id":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu.html#course","url":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu.html","name":"TPU Setup: Provisioning & Runtime Verification","description":"Step 1 of the 3-part Cloud TPU mini-course. Choose the right TPU slice, provision a Cloud TPU VM (or Colab TPU), bootstrap ~/jax-tpu-lab/.venv with jax[tpu], verify a synchronized pmap runtime receipt, and practice clean teardown.","inLanguage":"en","isAccessibleForFree":true,"author":{"@id":"https://www.tahabouhsine.com/jaxpathways/#author"},"provider":{"@id":"https://www.tahabouhsine.com/jaxpathways/#project"},"teaches":"Select a single-host TPU topology, provision a Cloud TPU VM (or Colab TPU), bootstrap jax[tpu] in an isolated .venv, verify pmap execution, and confirm clean VM deletion.","coursePrerequisites":["Setup & first steps"],"dateModified":"2026-10-27","syllabusSections":[{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-01.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-01.html","name":"Select a TPU slice and provision your Cloud TPU VM","description":"Choose and identify a named single-host TPU topology, distinguish physical chips from JAX devices, compare per-device memory-fit assumptions and verify a requested-target receipt before a route-owned teardown."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-04.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-04.html","name":"Bootstrap .venv and verify a TPU runtime receipt","description":"Use the pinned TPU runtime, compare synchronized arithmetic with its oracle and distinguish requested backend/device readiness from a CPU rehearsal; retrieve the receipt and clean up only named owned resources."}]}},{"@type":"ListItem","position":21,"item":{"@type":"Course","@id":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu-workflows.html#course","url":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu-workflows.html","name":"TPU Workflows: Launching Jobs & Checkpointed Experiments","description":"Step 2 of the 3-part Cloud TPU mini-course. Rehearse checkpointed jobs on CPU, then use only source-reviewed TPU targets with matching backend and dependency contracts. Separate single-host receipts, bounded multi-host recovery, and broader multi-host training qualification.","inLanguage":"en","isAccessibleForFree":true,"author":{"@id":"https://www.tahabouhsine.com/jaxpathways/#author"},"provider":{"@id":"https://www.tahabouhsine.com/jaxpathways/#project"},"teaches":"Classify each exact program before staging. Route CPU-only and unreviewed scripts to CPU or inspection; use a TPU target only when its backend, pinned dependencies, topology, and data ownership are reviewed. Treat --worker=all discovery as topology evidence, not distributed training.","coursePrerequisites":["TPU Setup: Provisioning & Runtime Verification"],"dateModified":"2026-10-27","syllabusSections":[{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-02.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-02.html","name":"Stage and launch checkpointed TPU jobs","description":"Stage launch.py to a TPU VM, separate first-step XLA compilation warmup from steady-state step timing, and verify that resuming from an atomic checkpoint matches an uninterrupted run."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-05.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-05.html","name":"Review scripts before TPU staging","description":"Classify the exact program before staging: keep `distributed-02` on CPU and generate a TPU launch only for a reviewed target whose backend, dependencies, topology, and data ownership are explicit. Distinguish multi-host discovery from a qualified distributed update."}]}},{"@type":"ListItem","position":22,"item":{"@type":"Course","@id":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu-systems.html#course","url":"https://www.tahabouhsine.com/jaxpathways/phase-guides/tpu-systems.html","name":"TPU Systems: Generations, Memory, Precision & XProf","description":"Step 3 of the 3-part Cloud TPU mini-course. Compare TPU v5e, v5p, and v6e specifications and ridge points, budget training and KV-cache HBM before provisioning, measure BF16 and INT8 numerical error, and capture warmed XProf traces.","inLanguage":"en","isAccessibleForFree":true,"author":{"@id":"https://www.tahabouhsine.com/jaxpathways/#author"},"provider":{"@id":"https://www.tahabouhsine.com/jaxpathways/#project"},"teaches":"Compare published TPU roofline estimates, budget training and KV-cache HBM, compare BF16 result-dtype policies and an INT8 weight-dequantization reference, and retain a warmed profiler trace with its observed backend.","coursePrerequisites":["TPU Workflows: Launching Jobs & Checkpointed Experiments"],"dateModified":"2026-10-27","syllabusSections":[{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-03.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-03.html","name":"TPU generations and HBM memory budgeting","description":"Compare TPU generation tradeoffs, prove per-device replicated versus sharded memory fit, and budget training state separately from inference KV cache."},{"@type":"Syllabus","@id":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-06.html#syllabus","url":"https://www.tahabouhsine.com/jaxpathways/lesson-tpu-06.html","name":"bfloat16, int8 precision, and XProf profiling on TPU","description":"Measure BF16 operand and requested result-dtype error against a finite-precision FP32 JAX reference, inspect CPU dtype and compiler evidence, and retain a warmed XProf trace with its observed backend."}]}}]}]}</script></head><body></body></html>
