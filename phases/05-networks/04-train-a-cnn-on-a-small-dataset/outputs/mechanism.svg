    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>The purple square selects one three-by-three patch within a five-by-five input. Each selected cell contributes to one output under the declared convolution. Moving the patch reuses weights. This separate shape example has three valid positions per axis at stride one without padding; it does not display learned weights.</dc:description>
