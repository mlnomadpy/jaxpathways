   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Workstation requests a TPU topology. One Linux VM host owns one JAX process; that process sees JAX devices; an explicit generation and API topology maps those JAX devices to physical chips and per-chip HBM. Device count and chip count are separate labels.</dc:description>
