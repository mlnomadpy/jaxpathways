   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172334" x="261.124135" y="54.997149" transform="rotate(-0 261.124135 54.997149)">Cloud control plane: API + machine type + topology determine hosts and chips</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172334" x="261.124135" y="134.111346" transform="rotate(-0 261.124135 134.111346)">Linux VM host 0 runs JAX process 0 (one process in this single-host example)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172334" x="261.124135" y="213.058668" transform="rotate(-0 261.124135 213.058668)">Process 0 records jax.devices() and jax.local_devices() (JAX device counts)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172334" x="261.124135" y="292.339739" transform="rotate(-0 261.124135 292.339739)">Generation/API topology maps devices to physical chips; per-chip HBM is separate</text>
