    <dc:description>Both analytic matrices have unit marginal variances. Purple adds covariance \(0.8\), stretching along the shared diagonal; green has zero covariance. These are unit Mahalanobis-distance contours, not 95% regions or fitted samples. Sum variances are \(3.6\) and \(2\), respectively.</dc:description>
