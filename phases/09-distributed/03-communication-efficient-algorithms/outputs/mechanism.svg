    <dc:description>Contributions \([1,2]\) and \([3,4]\) are summed into portions \([4]\) and \([6]\). After reduce-scatter neither participant holds the full result. All-gather then gives each \([4,6]\). This analytic example shows ownership, not a physical schedule or measured traffic.</dc:description>
