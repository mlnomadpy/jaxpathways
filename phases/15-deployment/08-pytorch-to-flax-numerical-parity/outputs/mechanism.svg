    <dc:description>Read each row as one elementwise decision using absolute tolerance \(2\times10^{-6}\) and relative tolerance \(2\times10^{-5}\). Near zero the absolute term determines the allowance. At reference \(100\), the relative term increases it. These are hand-worked tolerance examples, not measured conversion errors; the executed bar plot below reports the model comparison.</dc:description>
