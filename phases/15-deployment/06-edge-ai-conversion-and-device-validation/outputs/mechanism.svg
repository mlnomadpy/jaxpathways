   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Read the two columns as a hypothetical serial request before and after halving only inference. Preprocessing and transfer/response work remain unchanged. Add down each column: the total moves from \(24\) to \(20\) milliseconds, a \(1.2\)-fold improvement. These times are analytic teaching values; the separate plot contains actual local CPU request measurements.</dc:description>
