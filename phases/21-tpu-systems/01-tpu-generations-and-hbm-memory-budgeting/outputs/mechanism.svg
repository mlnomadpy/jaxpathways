   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Conceptual TPU per-device ledger: replicated training state is copied to every chip; explicitly sharded state is partitioned across chips; activations and temporaries use additional HBM; a separate inference path holds KV cache; BF16 operands stream from HBM to compute.</dc:description>
