 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Mechanism diagram for reverse GAE. At t=0, position 0 transitions to position 1 with reward 1, delta 1 and trace mask 1. At t=1, position 1 transitions to final pre-reset position 3 with reward 2. Continuing-cutoff bootstrap mask 1 gives delta and advantage 3; the trace mask is 0. The reverse arrow contributes 0.25 times 3 to A0, giving 1.75. A reset observation at position 0 is isolated from the prior episode. At a finite deadline or true terminal, bootstrap mask is 0, giving delta 1 and A0 1.25 for the finite-horizon case.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.10.8, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
