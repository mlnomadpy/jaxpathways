name: Optional two-controller CPU recovery
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  multiprocess-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: requirements-beginner.txt
      - run: python -m pip install -r requirements-beginner.txt
      - name: Check weighted updates, whole-cluster recovery and preflight rejection
        run: >-
          python projects/sharded-training/multiprocess/check.py
          --stage all
          --candidate projects/sharded-training/multiprocess/solution/model.py
          --work /tmp/multiprocess-recovery
          --output /tmp/multiprocess-recovery/report.json
        env:
          JAX_PLATFORMS: cpu
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: multiprocess-recovery-cpu-evidence
          path: /tmp/multiprocess-recovery
          if-no-files-found: ignore
