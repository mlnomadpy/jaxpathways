name: Course checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tpu-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: resources/tpu-gcp/requirements-*.txt
      - run: python -m pip install -r resources/tpu-gcp/requirements-multihost.txt --find-links https://storage.googleapis.com/jax-releases/libtpu_releases.html
      - run: python -c "import jax, flax, orbax.checkpoint, tensorstore, gcsfs, fsspec; assert fsspec.get_filesystem_class('gs').__module__ == 'gcsfs.core'"
        env:
          JAX_PLATFORMS: cpu
          GCSFS_EXPERIMENTAL_ZB_HNS_SUPPORT: 'false'
      - run: python resources/tpu-gcp/check_multihost_target.py
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install numpy==2.4.4
      - run: python -m pip install black==26.5.1
      - run: npm ci
      - run: npm run check
      - run: npm run check:deployment
      - run: xargs python -m black --check < scripts/python-format-files.txt
      - name: Validate EPUB with official W3C EPUBCheck
        run: |
          curl -fL https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o /tmp/epubcheck.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  /tmp/epubcheck.zip" | sha256sum --check
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar public/downloads/jax-foundations.epub --json /tmp/epubcheck-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: epubcheck-report
          path: /tmp/epubcheck-report.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install numpy==2.4.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:cpu
      - run: npm run test:tpu-lessons
      - run: npm run test:tpu-launcher
      - run: python resources/tpu-gcp/check_collectives_target.py
      - run: python resources/tpu-gcp/check_multihost_target.py
      - run: npm run test:tpu-precision
      - run: python docs/evidence/tpu-qualification-2026-10-20/v5e16/restore-on-cpu.py
      - run: npm run test:math
      - uses: actions/upload-artifact@v6
        with:
          name: lesson-cpu-receipt
          path: curriculum/validation.json
  projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python scripts/check-projects.py --shard ${{ matrix.shard }}/4 --receipt /tmp/projects-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: project-cpu-receipt-${{ matrix.shard }}
          path: /tmp/projects-${{ matrix.shard }}.json
  loggers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            projects/reproducible-experiments/requirements-loggers.txt
      - run: python -m pip install -r requirements-cpu.txt -r projects/reproducible-experiments/requirements-loggers.txt
      - run: python projects/reproducible-experiments/tests/loggers_check.py

  numpyro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/bayesian-regression/requirements-numpyro.txt
      - run: python -m pip install -r projects/bayesian-regression/requirements-numpyro.txt
      - name: Verify raw NumPyro samples and independent diagnostic controls
        run: python projects/bayesian-regression/tests/check_numpyro.py --implementation projects/bayesian-regression/solution/numpyro_workflow.py --evidence-dir /tmp/numpyro-evidence
        env:
          JAX_PLATFORMS: cpu
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: numpyro-cpu-evidence
          path: /tmp/numpyro-evidence
          if-no-files-found: ignore

  diffrax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/scientific-inverse/requirements-science.txt
      - run: python -m pip install -r projects/scientific-inverse/requirements-science.txt
      - name: Verify adaptive solves, sensitivities and same-data inverse checks
        run: python projects/scientific-inverse/tests/check_diffrax.py --implementation projects/scientific-inverse/solution/diffrax_workflow.py --evidence-dir /tmp/diffrax-evidence
        env:
          JAX_PLATFORMS: cpu
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diffrax-cpu-evidence
          path: /tmp/diffrax-evidence
          if-no-files-found: ignore

  decoder-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/text-harness/foundations/requirements-foundations.txt
      - run: python -m pip install -r projects/text-harness/foundations/requirements-foundations.txt
      - name: Verify natural-text training, cache parity and fresh-process recovery
        run: python projects/text-harness/foundations/tests/check_foundations.py --implementation projects/text-harness/foundations/model.py --output /tmp/decoder-foundations-evidence
        env:
          JAX_PLATFORMS: cpu
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: decoder-foundations-cpu-evidence
          path: /tmp/decoder-foundations-evidence
          if-no-files-found: ignore
