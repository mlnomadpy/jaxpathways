name: Course checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-course:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-cpu.txt
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:cpu
      - run: npm run test:tpu-precision
      - run: npm run test:math
      - run: npm run test:project
      - run: npm run build
      - run: npm run check
      - run: npm run check:deployment
