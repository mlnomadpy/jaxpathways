name: Deploy static Astro site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/course-check.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: withastro/action@v6
        with:
          node-version: '24'
          # The verify job already ran the complete suite and subpath checks.
          # Check this final deployment output without rebuilding it a second time.
          build-cmd: npm run build && python3 scripts/check-distribution.py && npm run check:site
        env:
          BASE_PATH: /jaxpathways
          SITE_URL: https://www.tahabouhsine.com
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
