name: Image model pilot public evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-public-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
      - name: Install pinned numeric-check dependencies
        run: python -m pip install -r projects/image-model-300m/tools/requirements-numeric.txt
      - name: Reconstruct metrics from public numeric evidence
        run: python projects/image-model-300m/tools/check_v14_packet.py
      - name: Exercise packet rejection controls
        run: python projects/image-model-300m/tools/test_v14_packet_controls.py
